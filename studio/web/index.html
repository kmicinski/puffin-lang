<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puffin Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='0' y='13' font-size='13'%3E%F0%9F%90%A7%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/studio.css">
<link rel="stylesheet" href="/static/diff.css">
<link rel="stylesheet" href="/static/assist.css">
<link rel="stylesheet" data-name="vs/editor/editor.main" href="/vs/editor/editor.main.css">
<script src="/vs/loader.js"></script>
</head>
<body>
<header class="header">
  <div class="brand">
    <span class="logo">🐧</span>
    <span class="name">Puffin</span>
    <button id="project" class="project-name" title="Projects: open another, or make a new one" aria-haspopup="true" aria-expanded="false"></button>
    <div id="projects-menu" class="projects-menu" hidden></div>
  </div>
  <button id="load" class="btn run" title="Load the shown file into the session and run it (⇧⌘↵ · ,load)">Run ▸</button>
  <button id="interrupt" class="btn stop" title="Interrupt the running evaluation (Ctrl-C at the prompt · ,interrupt)" hidden>Stop</button>
  <button id="reset" class="btn" title="Discard every definition the session holds (,reset)">Reset session</button>
  <div class="header-right">
    <span id="connection" class="running-indicator bad" hidden>reconnecting…</span>
    <span id="lane" class="running-indicator" hidden><span class="dot"></span><span class="text"></span></span>
    <button id="check" class="check"></button>
    <button id="gist" class="btn quiet small" title="Copy the project's files to a new secret GitHub gist (⇧-click: public)">Gist</button>
    <button id="history" class="btn quiet small" title="Everything that happened in this project, in order (,history)">History</button>
  </div>
</header>
<main class="main">
  <section class="editor-pane">
    <aside id="files" class="files" hidden></aside>
    <div class="editor-column">
      <div class="file-tabs" id="tabs">
        <button id="files-toggle" class="tabs-toggle" title="The project's files (⌘⇧E · ,files)"></button>
        <div class="tab-list" id="tab-list"></div>
        <button id="new-file" class="tabs-add" title="A new file (,new NAME)">+</button>
      </div>
      <div id="proposals" class="proposal-bar" hidden></div>
      <div id="editor-wrap">
        <div id="editor"></div>
        <aside id="versions" hidden></aside>
        <aside id="history-panel" hidden></aside>
        <div id="notice" hidden></div>
      </div>
    </div>
    <div id="quick-open" class="quick-open" hidden></div>
    <div id="past" class="past" hidden>
      <div class="file-tabs past-tabs" id="past-tabs"></div>
      <div class="past-editor"></div>
    </div>
  </section>
  <div id="divider" title="Drag to resize"></div>
  <section class="right-pane" id="repl">
    <div class="pane-title">Output</div>
    <div id="transcript" class="console"></div>
    <div id="past-transcript" class="console past-transcript" hidden></div>
    <div class="repl prompt-row">
      <span class="prompt caret">puffin&gt;</span>
      <textarea id="prompt" rows="1" spellcheck="false" autocomplete="off"
        placeholder="evaluate a form — defines persist (↑/↓ history · ,help · Tab asks the assistant)"></textarea>
      <select id="scope" hidden title="What the assistant's answer may change">
        <option value="form">this form</option>
        <option value="selection">the selection</option>
        <option value="module">this module</option>
        <option value="program">the program</option>
      </select>
    </div>
  </section>
</main>
<div id="clock" class="clock"></div>
<div id="replay" class="replay" hidden></div>
<script type="module" src="/static/main.js"></script>
</body>
</html>
